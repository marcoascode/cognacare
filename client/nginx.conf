# Configuração do Nginx para o contêiner do cliente.
# Este arquivo garante que o roteamento do React (React Router) funcione corretamente.

server {
    listen 80;
    server_name localhost;

    # Define a pasta raiz onde os arquivos estáticos estão localizados.
    root /usr/share/nginx/html;
    index index.html;

    # Bloco principal para tratar todas as requisições.
    location / {
        # Esta é a diretiva chave para SPAs (Single Page Applications).
        # 1. Tenta encontrar um arquivo com o nome exato da URL ($uri).
        # 2. Se não encontrar, tenta encontrar uma pasta com esse nome ($uri/).
        # 3. Se ambos falharem, ele serve o arquivo /index.html.
        # Isso permite que o React Router controle a navegação na página.
        try_files $uri $uri/ /index.html;
        
        # Aumentar para 5 ou 10 minutos (300s ou 600s)
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        
        # Se usar FastCGI (PHP), ajuste também:
        fastcgi_read_timeout 600s;
    }
}
